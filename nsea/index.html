<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0a0a0a',      // Pitch black background
                            card: '#141414',    // Slightly lighter for cards
                            accent: '#D4AF37',  // Premium Metallic Gold
                            gold: '#F3E5AB',    // Soft light gold
                            neon: '#ff2a2a'     // Hot red for accents
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'], // Gives a luxury magazine feel
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide Scrollbar for Horizontal Scrolling */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Gold Gradient Text */
        .text-gold-gradient {
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Story Ring Animation */
        .story-ring {
            background: linear-gradient(45deg, #D4AF37, #ff2a2a);
            padding: 2px;
            border-radius: 50%;
        }

        /* Image Gradient Overlays */
        .overlay-dark {
            background: linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,0.4) 50%, rgba(10,10,10,0) 100%);
        }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- Header: Minimal & Luxury -->
    <header class="sticky top-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-white/10">

            </div>

    <main class="container mx-auto max-w-lg sm:max-w-xl md:max-w-2xl lg:max-w-4xl px-0 pt-4">

        </div>
        <div class="flex overflow-x-auto hide-scroll space-x-4 px-4 pb-4" id="storyContainer">
            <!-- Dynamic Stories Injected Here -->
        </div>

        <div class="w-full h-px bg-white/10 my-4 mx-4 w-[calc(100%-2rem)]"></div>

        <!-- 视觉变调 2：Spotlight 焦点大图 -->
        <div class="px-4 mb-8">
            <div class="relative w-full h-[450px] rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(212,175,55,0.15)] group">
                <img src="img/1.jpg" alt="Spotlight" class="w-full h-full object-cover transform transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 overlay-dark"></div>
                
                <!-- Tag -->
                <div class="absolute top-4 left-4 bg-brand-accent text-black text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                    Babe of the Week
                </div>

                <!-- Info -->
                <div class="absolute bottom-0 left-0 w-full p-6">
                    <h2 class="text-4xl font-serif font-bold text-white mb-1 shadow-black drop-shadow-md">Nneka, 22</h2>
                    <p class="text-brand-gold text-sm font-medium mb-4 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        Lekki Phase 1 • UNILAG Student
                    </p>
                    <button onclick="bookAgent()" class="w-full bg-white text-black py-3.5 rounded-2xl font-bold text-sm hover:bg-brand-accent transition-colors flex justify-center items-center shadow-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        Request Private Link-up
                    </button>
                </div>
            </div>
        </div>

        <!-- 视觉变调 3：横向杂志排版 (VIP卡片) -->
        <div class="px-4 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-serif font-bold text-white">VIP Escorts</h2>
            </div>
            <div class="space-y-4" id="magazineContainer">
                <!-- Magazine style rows injected here -->
            </div>
        </div>

        <!-- 视觉变调 4：经典精巧的双列网格 (全量数据填充) -->
        <div class="px-4 mb-10">
            <h2 class="text-xl font-serif font-bold text-white mb-4">Just Dropped 💦</h2>
            
            <!-- Grid 布局，自动适应双列或多列 -->
            <div class="grid grid-cols-2 gap-4" id="gridContainer">
                <!-- 所有的剩余数据都将在这里循环渲染出来 -->
            </div>

            <!-- 触底转化按钮 Load More / View All -->
            <button onclick="bookAgent()" class="w-full mt-8 py-4 rounded-xl border border-brand-accent/40 text-brand-gold font-bold text-sm bg-brand-card hover:bg-brand-accent hover:text-black transition-all duration-300 flex justify-center items-center shadow-[0_0_20px_rgba(212,175,55,0.05)] hover:shadow-[0_0_25px_rgba(212,175,55,0.25)] group">
                <svg class="w-5 h-5 mr-2 group-hover:animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                Unlock More Elite Babes
            </button>
        </div>

    </main>

    <!-- Script to Handle Data and Layouts -->
    <script>
        function bookAgent() {
         window.location.href="https://sd022.xyz/p/Q8qgJvuP";
        }

        ];

        // 1. 渲染顶部 Stories
        const storyCont = document.getElementById('storyContainer');
        storyUsers.forEach(user => {
            storyCont.innerHTML += `
                <div class="flex flex-col items-center flex-shrink-0 w-[72px] cursor-pointer hover:scale-105 transition-transform" onclick="bookAgent()">

        const magCont = document.getElementById('magazineContainer');
        vipUsers.forEach((user, index) => {
            const isEven = index % 2 === 0;
            magCont.innerHTML += `
                <div class="bg-brand-card rounded-2xl overflow-hidden flex h-36 border border-white/5 relative cursor-pointer hover:border-brand-accent/30 transition-colors shadow-lg" onclick="bookAgent()">

                        <div class="absolute inset-0 ${isEven ? 'bg-gradient-to-r' : 'bg-gradient-to-l'} from-brand-card to-transparent w-full h-full"></div>
                    </div>
                    <div class="w-3/5 p-4 flex flex-col justify-center ${isEven ? 'order-2 pl-2' : 'order-1 pr-2'}">
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="w-2 h-2 rounded-full bg-brand-neon animate-pulse shadow-[0_0_8px_#ff2a2a]"></span>
                            <span class="text-[10px] text-brand-neon font-bold uppercase tracking-wide">${user.status}</span>
                        </div>
                        <h3 class="text-lg font-serif font-bold text-white">${user.name}, ${user.age}</h3>
                        <p class="text-xs text-brand-gold mb-2">${user.role}</p>
                        <p class="text-[10px] text-gray-400 flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>

                </div>
            `;
        });

        // 3. 渲染底部瀑布流/网格 
        const gridCont = document.getElementById('gridContainer');
        gridUsers.forEach(user => {
            gridCont.innerHTML += `
                <div class="bg-brand-card rounded-xl overflow-hidden border border-white/5 relative cursor-pointer hover:-translate-y-1 hover:shadow-[0_4px_15px_rgba(212,175,55,0.1)] transition-all duration-300" onclick="bookAgent()">
                    <div class="relative h-44 sm:h-52">
                        <img src="img/${user.img}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 overlay-dark"></div>
                        <div class="absolute bottom-2 left-2 right-2">

                            </span>

                    <div class="p-2.5">

                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>

</body>
</html>
